name: generate monkeytype readme svg

on:
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours
  workflow_dispatch:         # lets you run it manually

permissions:
  contents: write            # needed so the action can push the SVG

jobs:
  download-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"

      - name: Generate Monkeytype Readme SVG
        uses: monkeytype-hub/monkeytype-readme@v1.0.0
        with:
          username: farhooralz
          themes: cyberspace          # your Monkeytype theme; spaces become _ (e.g. nord_light)
          target-branch: monkeytype-readme
          github-token: ${{ secrets.GITHUB_TOKEN }}
